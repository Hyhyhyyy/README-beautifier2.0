  <line x1="72" y1="172" x2="436" y2="172" stroke="#7dd3fc" stroke-width="6" stroke-linecap="round" stroke-dasharray="364" stroke-dashoffset="364">
    <animate attributeName="stroke-dashoffset" values="364;0;0;364" dur="6s" repeatCount="indefinite"/>
  </line>
  <text x="70" y="150" font-size="60" font-weight="800" fill="url(#title)">md-converter</text>
  <text x="72" y="198" font-size="22" fill="#d6e6fe" opacity="0.92">Markdown ⇄ PDF / DOCX 互转</text>
