<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 380" role="img" aria-label="md-converter" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0c4a6e"/>
      <stop offset="0.5" stop-color="#0369a1"/>
      <stop offset="1" stop-color="#0891b2"/>
    </linearGradient>
    <linearGradient id="title" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#7dd3fc"/>
    </linearGradient>
    <linearGradient id="page" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1d4ed8"/>
      <stop offset="1" stop-color="#0c4a6e"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#7dd3fc" stop-opacity="0.42"/>
      <stop offset="1" stop-color="#7dd3fc" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="beam" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#7dd3fc" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect width="1280" height="380" fill="url(#bg)"/>
  <ellipse cx="980" cy="200" rx="200" ry="165" fill="url(#glow)"/>
  <circle cx="1066" cy="120" r="6" fill="#fde68a" opacity="0.9"/>
  <circle cx="900" cy="284" r="5" fill="#a5f3fc" opacity="0.85"/>
  <circle cx="1090" cy="278" r="4" fill="#e0f2fe" opacity="0.7"/>
  <rect x="-220" y="0" width="220" height="380" fill="url(#beam)">
    <animate attributeName="x" values="-220;1300;-220" dur="7.5s" repeatCount="indefinite"/>
  </rect>
  <g transform="translate(980,190)">
