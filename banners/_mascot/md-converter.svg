      <rect x="-36" y="-44" width="56" height="8" rx="4" fill="#e0f2fe"/>
      <rect x="-36" y="-26" width="68" height="8" rx="4" fill="#e0f2fe" opacity="0.85"/>
      <rect x="-36" y="-8" width="48" height="8" rx="4" fill="#e0f2fe" opacity="0.7"/>
      <text x="-34" y="36" font-family="monospace" font-size="26" font-weight="800" fill="#fde68a">MD</text>
    </g>
    <g>
      <animateTransform attributeName="transform" type="translate" values="0 0;14 0;0 0" dur="2.8s" repeatCount="indefinite"/>
      <path d="M70,-12 L92,0 L70,12" fill="none" stroke="#fbbf24" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M92,16 L70,28 L92,40" fill="none" stroke="#fbbf24" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
