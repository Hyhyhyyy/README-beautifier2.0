      <stop offset="1" stop-color="#fcd34d"/>
      <animate attributeName="x1" values="0;0.3;0" dur="8s" repeatCount="indefinite"/>
      <animate attributeName="x2" values="1;0.7;1" dur="8s" repeatCount="indefinite"/>
    </linearGradient>
    <filter id="blur_readmebeautifier" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="34"/>
    </filter>
    <clipPath id="clip_readmebeautifier"><rect x="0" y="0" width="1280" height="380" rx="18"/></clipPath>

  </defs>
