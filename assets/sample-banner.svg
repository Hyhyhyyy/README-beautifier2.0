<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 380" role="img" aria-label="sample-banner" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4338ca"/>
      <stop offset="0.55" stop-color="#7c3aed"/>
      <stop offset="1" stop-color="#db2777"/>
    </linearGradient>
    <linearGradient id="title" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#f0abfc"/>
      <stop offset="1" stop-color="#fde68a"/>
    </linearGradient>
    <linearGradient id="body" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#e879f9"/>
      <stop offset="1" stop-color="#6d28d9"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#f0abfc" stop-opacity="0.30"/>
      <stop offset="1" stop-color="#f0abfc" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="beam" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#f0abfc" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect width="1280" height="380" fill="url(#bg)"/>
  <ellipse cx="980" cy="200" rx="205" ry="170" fill="url(#glow)"/>
  <circle cx="250" cy="300" r="9" fill="#fde68a" opacity="0.6"/>
  <circle cx="1130" cy="74" r="11" fill="#e879f9" opacity="0.6"/>
  <circle cx="1170" cy="320" r="7" fill="#f0abfc" opacity="0.6"/>
  <rect x="-220" y="0" width="220" height="380" fill="url(#beam)">
    <animate attributeName="x" values="-220;1300;-220" dur="7s" repeatCount="indefinite"/>
  </rect>
  <g transform="translate(980,190)">
    <g>
      <animateTransform attributeName="transform" type="translate" values="0 0;0 -16;0 0" dur="3s" repeatCount="indefinite"/>
      <g>
        <animateTransform attributeName="transform" type="rotate" values="-8;8;-8" dur="4.2s" repeatCount="indefinite"/>
        <polygon points="0,-80 62,0 0,80 -62,0" fill="url(#body)" stroke="#f0abfc" stroke-width="11" stroke-linejoin="round"/>
        <polygon points="0,-80 62,0 0,0 -62,0" fill="#ffffff" opacity="0.18"/>
      </g>
    </g>
  </g>
  <line x1="72" y1="170" x2="430" y2="170" stroke="#fde68a" stroke-width="6" stroke-linecap="round" stroke-dasharray="358" stroke-dashoffset="358">
    <animate attributeName="stroke-dashoffset" values="358;0;0;358" dur="6s" repeatCount="indefinite"/>
  </line>
  <text x="70" y="150" font-size="54" font-weight="800" fill="url(#title)">Your Project</text>
  <text x="72" y="198" font-size="22" fill="#f5d0fe" opacity="0.92">项目一句话描述 · 核心能力亮点</text>
  <g font-size="16" font-weight="600">
    <rect x="72" y="220" width="120" height="34" rx="17" fill="#e879f9" opacity="0.20" stroke="#f0abfc" stroke-width="2"/>
    <text x="132" y="242" fill="#fde6fe" text-anchor="middle">标签一</text>
    <rect x="204" y="220" width="120" height="34" rx="17" fill="#fde68a" opacity="0.16" stroke="#fde68a" stroke-width="2"/>
    <text x="264" y="242" fill="#fff6d8" text-anchor="middle">标签二</text>
  </g>
</svg>
